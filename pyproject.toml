[project]
name = "long-horizon-311-memory"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "networkx>=3.4,<4",
    "pymongo>=4.9,<5",
]

[tool.setuptools.packages.find]
include = ["backend*"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
